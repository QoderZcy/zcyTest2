<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便签管理系统 - 赛博朋克风格</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <h1 class="logo">
                <span class="glitch" data-text="NOTES">NOTES</span>
                <span class="subtitle">// 便签管理系统</span>
            </h1>
            <a th:href="@{/notes/new}" class="btn btn-primary">
                <span>+ 新建便签</span>
            </a>
        </header>

        <!-- 消息提示 -->
        <div th:if="${message}" class="message message-success">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="message message-error">
            <span th:text="${error}"></span>
        </div>

        <!-- 便签卡片网格 -->
        <div class="notes-grid" th:if="${notes != null && !notes.isEmpty()}">
            <div class="note-card" th:each="note : ${notes}">
                <div class="card-header">
                    <h3 class="note-title" th:text="${note.title}">便签标题</h3>
                    <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post" 
                          onsubmit="return confirm('确定要删除这个便签吗？');">
                        <button type="submit" class="btn-delete" title="删除">×</button>
                    </form>
                </div>
                <div class="card-body" th:onclick="'window.location.href=\'/notes/' + ${note.id} + '\''">
                    <p class="note-preview" th:text="${note.contentPreview}">内容预览...</p>
                    <div class="card-footer">
                        <span class="timestamp" th:text="${note.createdTime}">2025-11-28 12:00:00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" th:if="${notes == null || notes.isEmpty()}">
            <div class="empty-icon">📝</div>
            <h2>暂无便签</h2>
            <p>点击右上角的"新建便签"按钮创建您的第一个便签</p>
            <a th:href="@{/notes/new}" class="btn btn-primary">
                <span>开始创建</span>
            </a>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
