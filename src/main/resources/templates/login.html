<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 照片上传系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group input.error {
            border-color: #e74c3c;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert.show {
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>📸 照片上传系统</h1>
            <p>欢迎回来，请登录您的账户</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">登录</div>
            <div class="tab" onclick="switchTab('register')">注册</div>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <!-- 登录表单 -->
        <div id="loginTab" class="tab-content active">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" name="username" required 
                           placeholder="请输入用户名" autocomplete="username">
                    <div class="error-message" id="loginUsernameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" name="password" required 
                           placeholder="请输入密码" autocomplete="current-password">
                    <div class="error-message" id="loginPasswordError"></div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">登录</button>
            </form>
            
            <div class="loading" id="loginLoading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">登录中...</p>
            </div>
        </div>
        
        <!-- 注册表单 -->
        <div id="registerTab" class="tab-content">
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerUsername">用户名</label>
                    <input type="text" id="registerUsername" name="username" required 
                           placeholder="请输入用户名" autocomplete="username" minlength="3" maxlength="50">
                    <div class="error-message" id="registerUsernameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="registerEmail">邮箱（可选）</label>
                    <input type="email" id="registerEmail" name="email" 
                           placeholder="请输入邮箱" autocomplete="email">
                    <div class="error-message" id="registerEmailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">密码</label>
                    <input type="password" id="registerPassword" name="password" required 
                           placeholder="请输入密码（至少6位）" autocomplete="new-password" minlength="6">
                    <div class="error-message" id="registerPasswordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="registerPasswordConfirm">确认密码</label>
                    <input type="password" id="registerPasswordConfirm" name="passwordConfirm" required 
                           placeholder="请再次输入密码" autocomplete="new-password" minlength="6">
                    <div class="error-message" id="registerPasswordConfirmError"></div>
                </div>
                
                <button type="submit" class="login-btn" id="registerBtn">注册</button>
            </form>
            
            <div class="loading" id="registerLoading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">注册中...</p>
            </div>
        </div>
    </div>

    <script>
        // 切换标签页
        function switchTab(tab) {
            // 更新标签
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // 更新内容
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.getElementById('registerTab').classList.add('active');
            }
            
            // 清除提示
            hideAlert();
        }
        
        // 显示提示
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type} show`;
        }
        
        // 隐藏提示
        function hideAlert() {
            const alert = document.getElementById('alert');
            alert.className = 'alert';
        }
        
        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // 基础校验
            if (!username || !password) {
                showAlert('请填写用户名和密码', 'error');
                return;
            }
            
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loginLoading');
            
            loginBtn.disabled = true;
            loading.classList.add('show');
            hideAlert();
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showAlert('登录成功！正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = result.data.redirectUrl || '/';
                    }, 1000);
                } else {
                    showAlert(result.message || '登录失败', 'error');
                    loginBtn.disabled = false;
                    loading.classList.remove('show');
                }
            } catch (error) {
                showAlert('登录失败: ' + error.message, 'error');
                loginBtn.disabled = false;
                loading.classList.remove('show');
            }
        }
        
        // 处理注册
        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            
            // 校验
            if (username.length < 3) {
                showAlert('用户名至少3个字符', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('密码至少6个字符', 'error');
                return;
            }
            
            if (password !== passwordConfirm) {
                showAlert('两次输入的密码不一致', 'error');
                return;
            }
            
            const registerBtn = document.getElementById('registerBtn');
            const loading = document.getElementById('registerLoading');
            
            registerBtn.disabled = true;
            loading.classList.add('show');
            hideAlert();
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                if (email) {
                    formData.append('email', email);
                }
                
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showAlert('注册成功！请登录', 'success');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                    }, 1500);
                } else {
                    showAlert(result.message || '注册失败', 'error');
                    registerBtn.disabled = false;
                    loading.classList.remove('show');
                }
            } catch (error) {
                showAlert('注册失败: ' + error.message, 'error');
                registerBtn.disabled = false;
                loading.classList.remove('show');
            }
        }
    </script>
</body>
</html>
